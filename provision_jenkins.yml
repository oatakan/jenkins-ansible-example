---
- name: Provision Jenkins Server
  hosts: all
  become: true
  vars:
    jenkins_admin_username: admin
    jenkins_admin_password: "admin"
    jenkins2_cli_username: "{{ jenkins_admin_username }}"
    jenkins2_cli_password: "{{ jenkins_admin_password }}"
    jenkins2_config_http_port: 8080
    jenkins2_credentials_enabled: true
    jenkins2_credentials:
      githubtoken:
        type: "secrettext"
        id: "github_token"
        description: "github credentials"
        token: "{{ github_token | default('') }}"
    jenkins2_github_enabled: true
    github_external_url: https://api.github.com
    github_manage_hooks: false
    jenkins2_github_token_cred: github_token
    jenkins_http_port: "{{ jenkins2_config_http_port }}"
    jenkins_plugins:
      - ant
      - antisamy-markup-formatter
      - blueocean
      - configuration-as-code
      - build-timeout
      - cloudbees-folder
      - credentials-binding
      - ec2
      - email-ext
      - file-operations
      - git
      - gitlab-plugin
      - gradle
      - ldap
      - mailer
      - matrix-auth
      - pipeline-stage-view
      - pipeline-utility-steps
      - ssh-agent
      - ssh-slaves
      - timestamper
      - workflow-aggregator
      - ws-cleanup
      - job-dsl
      - checkstyle
      - log-parser
      - pmd
      - warnings-ng
      - permissive-script-security
  pre_tasks:
    - name: Validate execution-context publication switch
      ansible.builtin.assert:
        that:
          - publish_execution_context is undefined or publish_execution_context is boolean
      no_log: true
      tags: [always]

    - name: Validate safe inventory-observed execution context fields
      ansible.builtin.assert:
        that:
          - inventory_hostname is string
          - inventory_hostname | length > 0
          - inventory_hostname | length <= 253
          - inventory_hostname == (inventory_hostname | trim)
          - "'@' not in inventory_hostname"
          - "'://' not in inventory_hostname"
          - "inventory_hostname is match('^[A-Za-z0-9_.:-]+$')"
          - (ansible_host | default(inventory_hostname)) is string
          - (ansible_host | default(inventory_hostname)) | length > 0
          - (ansible_host | default(inventory_hostname)) | length <= 253
          - (ansible_host | default(inventory_hostname)) == ((ansible_host | default(inventory_hostname)) | trim)
          - "'@' not in (ansible_host | default(inventory_hostname))"
          - "'://' not in (ansible_host | default(inventory_hostname))"
          - "(ansible_host | default(inventory_hostname)) is match('^([A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?|[0-9A-Fa-f:.]+)$')"
          - ansible_ssh_host is undefined
          - ansible_ssh_port is undefined
          - ansible_port is undefined or ((ansible_port is integer) and (ansible_port is not boolean) and (ansible_port >= 1) and (ansible_port <= 65535))
          - ansible_connection is undefined or ((ansible_connection is string) and (ansible_connection | length > 0) and (ansible_connection | length <= 64) and (ansible_connection == (ansible_connection | trim)) and (ansible_connection is match('^[A-Za-z0-9_.-]+$')))
          - vm_uid is undefined or ((vm_uid is string) and (vm_uid is match('^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$')))
      when: publish_execution_context | default(false)
      no_log: true
      tags: [always]

    - name: Publish allowlisted execution context without VM UID
      ansible.builtin.set_stats:
        data: "{{ {'provision_execution_context': {inventory_hostname: {'ansible_host': ansible_host | default(inventory_hostname), 'ansible_port': ansible_port | default(22), 'ansible_connection': ansible_connection | default('ssh')}}} }}"
        aggregate: true
        per_host: false
      when:
        - publish_execution_context | default(false)
        - vm_uid is undefined
      no_log: true
      tags: [always]

    - name: Publish allowlisted execution context with VM UID
      ansible.builtin.set_stats:
        data: "{{ {'provision_execution_context': {inventory_hostname: {'ansible_host': ansible_host | default(inventory_hostname), 'ansible_port': ansible_port | default(22), 'ansible_connection': ansible_connection | default('ssh'), 'vm_uid': vm_uid}}} }}"
        aggregate: true
        per_host: false
      when:
        - publish_execution_context | default(false)
        - vm_uid is defined
      no_log: true
      tags: [always]

  tasks:
    - name: Import EPEL GPG key
      ansible.builtin.rpm_key:
        state: present
        key: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_distribution_major_version }}
      when: ansible_os_family in ['RedHat', 'Rocky']

    - name: Include oatakan.rhn role
      ansible.builtin.include_role:
        name: oatakan.rhn
      when:
        - ansible_os_family == 'RedHat'
        - ec2_image_id is undefined

    - name: Include oatakan.rhel_upgrade role
      ansible.builtin.include_role:
        name: oatakan.rhel_upgrade
      when: ansible_os_family in ['RedHat', 'Rocky']

    - name: Include Java and Jenkins roles
      ansible.builtin.include_role:
        name: "{{ role_name }}"
      loop_control:
        loop_var: role_name
      loop:
        - geerlingguy.java
        - geerlingguy.jenkins
#        - lean_delivery.jenkins

    - name: Pip tasks
      become: true
      block:
        - name: Install pip
          ansible.builtin.package:
            name: python{{ ansible_facts.python.version.major }}-pip
            state: present
          register: pip_install_status
          until: pip_install_status is succeeded

        - name: Install Python packaging support
          ansible.builtin.package:
            name: python{{ ansible_facts.python.version.major }}-packaging
            state: present
          register: packaging_install_status
          until: packaging_install_status is succeeded

        - name: Upgrade pip
          ansible.builtin.pip:
            name:
              - pip
            state: present
            extra_args: --upgrade
            executable: "pip{{ ansible_facts.python.version.major }}"
          register: pip_upgrade
          until: pip_upgrade is success

        - name: Install pip packages
          ansible.builtin.pip:
            name:
              - python-jenkins
              - lxml
            state: present
            executable: "pip{{ ansible_facts.python.version.major }}"
          register: install_pip_packages
          until: install_pip_packages is success
